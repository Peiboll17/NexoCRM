name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Tipos · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Generar cliente Prisma
        run: bunx prisma generate

      - name: Lint (ESLint)
        run: bun run lint

      - name: Verificación de tipos (tsc)
        run: bunx tsc --noEmit

      - name: Build de producción
        run: bun run build
        env:
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "ci-test-secret"
